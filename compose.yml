services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      FRONTEND_URL: http://localhost:3000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8080/api
      NEXT_PUBLIC_RPC_URL: https://cloudflare-eth.com
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped
